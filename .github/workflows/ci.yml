name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same ref. Saves
# minutes when a PR is force-pushed multiple times in a row.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --omit=optional
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --omit=optional
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      # Sem --omit=optional: vitest/vite dependem do binário nativo opcional do
      # rollup (@rollup/rollup-linux-x64-gnu); omitir opcionais quebra com
      # "Cannot find module @rollup/rollup-linux-x64-gnu" (npm/cli#4828).
      - run: npm ci
      - run: npm run test
      - run: npm run test:security

  deno-test:
    name: Native Deno tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.8"
      - run: >-
          deno test --no-config --no-lock
          supabase/functions/caderno-reminders/handler.test.ts
          supabase/functions/calendar-notifications/worker.test.ts
          supabase/functions/hubspot-contact-sync/handler.test.ts
          supabase/functions/ops-health-alerts/worker.test.ts
          supabase/functions/_shared/aiEditionContext.test.ts
          supabase/functions/_shared/geminiModel.test.ts

  edge-pins:
    name: Edge Function pins
    runs-on: ubuntu-latest
    # Trava anti-regressão: falha se alguma Edge Function importar dep externa
    # sem pin completo (major.minor.patch). Ver docs/INCIDENTE_2026_05_17.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: node scripts/check-edge-function-pins.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, deno-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      # Sem --omit=optional pelo mesmo motivo do job de testes (binário do rollup).
      - run: npm ci
      # Build with mock env so the bundle resolves import.meta.env at compile time.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key
          VITE_SUPABASE_PROJECT_ID: example

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Falha em HIGH e CRITICAL. Exceções (só para correções que exigem major)
    # ficam em audit-allowlist.json, uma por advisory, com motivo e prazo.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --omit=optional
      - run: node scripts/check-npm-audit.mjs
