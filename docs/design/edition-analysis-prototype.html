<style>
:root{--background:#fbfbfc;--surface:#fff;--ink:#1a1d24;--muted:#626773;--line:#dde0e6;--wine:#7e1b34;--wine-soft:#f8edf1;--focus:#ab2350;--good:#23734d;--radius:12px;color-scheme:light;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--background)}

*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button,select,input{min-height:44px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button,select,input{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:10px 14px}button:hover:not(:disabled){border-color:var(--focus)}.primary{background:var(--wine);color:#fff;border-color:var(--wine)}.demo{padding:10px 24px;background:var(--wine-soft);font-size:12px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.demo strong{font-weight:750}.demo label{display:flex;gap:7px;align-items:center}.demo select{min-height:36px;padding:5px 9px}.shell{display:flex;min-height:calc(100vh - 58px)}aside{width:208px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:30px 18px}.brand{font-size:18px;line-height:1.3;font-weight:800;color:var(--ink);margin:0 0 34px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:5px}nav{display:flex;flex-direction:column;gap:6px}nav button{text-align:left;border-color:transparent;background:transparent}nav button[aria-current="page"]{background:var(--wine-soft);border-color:var(--line);font-weight:700}main{flex:1;min-width:0;padding:32px 40px 56px;max-width:1350px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.breadcrumb{font-size:12px;color:var(--muted)}.account{font-size:12px;color:var(--muted)}h1{font-size:28px;line-height:1.25;letter-spacing:-.6px;margin:0 0 9px;font-weight:750}h2{font-size:18px;line-height:1.4;margin:0}h3{font-size:15px;margin:0 0 10px}p{line-height:1.6;margin:8px 0}.intro{color:var(--muted);max-width:75ch;margin-bottom:24px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-wrap:anywhere}.tabs button{border:0;background:transparent;border-radius:0;padding:12px 0;font-weight:600;color:var(--muted)}.tabs button[aria-selected="true"]{border-bottom:3px solid var(--focus);color:var(--ink)}.section{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:24px;margin-top:20px;min-width:0}.section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.meta{color:var(--muted);font-size:12px}.badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:650;max-width:100%;overflow-wrap:anywhere}.notice{border-left:3px solid var(--focus);padding:10px 14px;background:var(--wine-soft);color:var(--ink);font-size:13px;line-height:1.6;margin:18px 0}.notice p{margin:0}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.edition-chart{min-width:0;border-left:1px solid var(--line);padding-left:16px}.edition-chart svg{display:block;width:100%;height:190px;margin-top:12px;overflow:visible}.edition-chart text{fill:var(--muted);font-size:11px}.edition-chart line{stroke:var(--line)}.edition-chart polyline{fill:none;stroke:var(--focus);stroke-width:2}.edition-chart circle{fill:var(--surface);stroke:var(--focus);stroke-width:3}.legend{font-size:12px;color:var(--muted);margin-top:10px}table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}caption{text-align:left;font-size:14px;font-weight:650;margin:14px 0}th,td{text-align:left;vertical-align:top;padding:14px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}th{color:var(--muted);font-size:12px;font-weight:600}th:first-child,td:first-child{padding-left:0}td:last-child,th:last-child{padding-right:0}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.cell-meta{display:block;color:var(--muted);font-size:11px;margin-top:5px}.own{background:var(--wine-soft)}.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:18px 0}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{font-size:12px;font-weight:600}.field input,.field select{max-width:100%;width:100%}.pagination{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-top:18px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.empty{border:1px dashed var(--line);background:var(--surface);border-radius:var(--radius);padding:38px 24px;text-align:center;margin-top:24px}.empty p{color:var(--muted);max-width:55ch;margin:10px auto 18px}.skeleton{height:20px;background:var(--line);border-radius:4px;margin:14px 0;max-width:100%}.skeleton:nth-child(2){width:72%}.skeleton:nth-child(3){width:88%}.split{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.split>.section{margin:0}.version-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.diff>div{padding:14px;background:var(--background);border:1px solid var(--line);border-radius:8px;min-width:0}.diff p{font-size:13px;overflow-wrap:anywhere}.success{color:var(--good)}dialog{width:min(720px,calc(100% - 32px));max-height:90dvh;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:24px;background:var(--surface);color:var(--ink)}dialog::backdrop{background:#0009}dialog h2{padding-right:40px}.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dialog-head button{flex-shrink:0;padding:8px 12px}dialog .section{padding:16px}.form-grid{display:grid;grid-template-columns:1fr 130px;gap:16px;margin:20px 0}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1000px){aside{width:174px}main{padding:28px 24px}.split{grid-template-columns:1fr}.account{display:none}}
@media(max-width:600px){aside{display:none}main{padding:22px 16px 40px}.demo{padding:10px 16px;gap:8px}.demo>span{width:100%}.demo label{flex:1;font-size:11px}.demo select{width:100%;min-width:0}.topline{margin-bottom:22px}h1{font-size:25px}.section{padding:18px 16px}.chart-grid{grid-template-columns:1fr;gap:18px}.edition-chart svg{height:150px}.tabs{gap:20px}.tabs button{font-size:12px}.section-title{flex-direction:column;gap:8px}.data-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.data-table tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}.data-table tr:last-child{border:0}.data-table td{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:6px 0;border:0;line-height:1.5}.data-table td:before{content:attr(data-label);color:var(--muted);font-size:12px}.data-table td>span{min-width:0}.data-table td .cell-meta{grid-column:2}.pagination{flex-wrap:wrap}.diff{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}dialog{padding:20px 16px}.footer{flex-wrap:wrap}.footer button{flex:1}.empty{padding:28px 18px}.breadcrumb{max-width:100%;overflow-wrap:anywhere}}
@media(prefers-reduced-motion:no-preference){button{transition:border-color .12s,background-color .12s}}
</style>

<body>
<div class="demo"><span><strong>Demonstração.</strong> Dados fictícios; nenhuma referência oficial.</span><label>Cena<select id="scene-picker"><option value="history">Comparativo</option><option value="ranking">Ranking</option><option value="cutoffs">Referências de corte</option><option value="bank">Banco de questões</option></select></label><label>Estado<select id="demo-state"><option value="ready">Com dados</option><option value="loading">Carregando</option><option value="error">Erro</option><option value="empty">Sem dados</option><option value="unconfigured">Não configurado</option><option value="insufficient">Participação insuficiente</option><option value="restricted">Sem intel.view</option><option value="incomplete">Versão incompleta</option><option value="locked">Conflito de edição</option></select></label><button id="theme-toggle" aria-label="Alternar tema">Tema</button></div>
<div class="shell"><aside><p class="brand">SanarFlix <small>Simulados ENAMED</small></p><nav aria-label="Navegação de demonstração"><button data-scene="history">Comparativo</button><button data-scene="ranking">Ranking</button><button data-scene="cutoffs">Referências de corte</button><button data-scene="bank">Banco de questões</button></nav></aside><main><div class="topline"><span class="breadcrumb" id="breadcrumb">Meu desempenho / Comparativo</span><span class="account">Ambiente de demonstração</span></div><div id="scene-root"></div></main></div>
<script>
const root=document.getElementById('scene-root');
const scenePicker=document.getElementById('scene-picker');
const statePicker=document.getElementById('demo-state');
let scene=new URLSearchParams(location.search).get('scene')||'history';
if(!['history','ranking','cutoffs','bank'].includes(scene))scene='history';
let state='ready';let dialogTrigger=null;
const points=[{edition:'2027.1',label:'ENAMED 2027.1',sequence:1,date:'03/04 (demo)',top:65,position:78,population:120},{edition:'2027.1',label:'ENAMED 2027.1',sequence:2,date:'17/04 (demo)',top:38,position:49,population:130},{edition:'2027.2',label:'ENAMED 2027.2',sequence:1,date:'02/09 (demo)',top:44,position:11,population:25},{edition:'2027.2',label:'ENAMED 2027.2',sequence:2,date:'16/09 (demo)',top:22,position:33,population:150}];
function statusBlock(){if(state==='loading')return '<section class="section" role="status" aria-label="Carregando"><h2>Carregando dados</h2><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>';if(state==='error')return '<section class="empty" role="alert"><h2>Não foi possível carregar os dados</h2><p>O conteúdo da consulta permanece no mesmo contexto. Tente novamente.</p><button class="primary" id="retry">Tentar novamente</button></section>';if(state==='empty')return '<section class="empty" data-empty><h2>Ainda não há dados neste contexto</h2><p>Os resultados e referências disponíveis aparecerão aqui. Nenhum valor foi estimado.</p></section>';return '';}
function percentileHistory(){return '<h1>Comparativo</h1><p class="intro">Acompanhe sua posição nos resultados elegíveis, respeitando os limites de cada edição.</p><div class="tabs" role="tablist" aria-label="Comparativo"><button role="tab" aria-selected="false">Nesta edição</button><button role="tab" aria-selected="true">Histórico por percentil</button></div>'+ (statusBlock()||'<section class="section"><div class="section-title"><div><h2>Sua posição ao longo das edições</h2><p class="meta">Menor Top X% indica melhor posição relativa na população daquele simulado.</p></div><span class="badge">Histórico pessoal</span></div><div class="chart-grid">'+['2027.1','2027.2'].map(code=>{const p=points.filter(x=>x.edition===code);return '<div class="edition-chart" data-edition-chart="'+code+'"><h3>ENAMED '+code+'</h3><svg viewBox="0 0 350 170" role="img" aria-label="Percentis na edição '+code+'; tabela completa a seguir"><line x1="35" x2="330" y1="20" y2="20"/><line x1="35" x2="330" y1="85" y2="85"/><line x1="35" x2="330" y1="140" y2="140"/><text x="0" y="23">1%</text><text x="0" y="88">50%</text><text x="0" y="143">99%</text><polyline points="95,'+(20+p[0].top*1.2)+' 270,'+(20+p[1].top*1.2)+'"/>'+p.map((x,i)=>'<circle cx="'+(95+i*175)+'" cy="'+(20+x.top*1.2)+'" r="5"><title>Top '+x.top+'%, posição '+x.position+' de '+x.population+', '+x.label+'</title></circle><text x="'+(74+i*175)+'" y="165">Simulado '+x.sequence+'</text>').join('')+'</svg></div>';}).join('')+'</div><p class="legend">A mudança de edição inicia outro grupo. Esta posição não é uma nota de proficiência.</p><div class="notice">Amostra pequena no Simulado 1 de 2027.2: 25 participantes. Variações de posição exigem cautela.</div><details open><summary>Ver dados em tabela</summary><table class="data-table"><caption>Resultados por população e edição</caption><thead><tr><th>Edição e simulado</th><th>Data</th><th>Posição</th><th>População</th><th>Top X%</th></tr></thead><tbody>'+points.map(p=>'<tr><td data-label="Resultado"><span>'+p.label+'<span class="cell-meta">Simulado '+p.sequence+'</span></span></td><td data-label="Data">'+p.date+'</td><td data-label="Posição">'+p.position+'</td><td data-label="População">'+p.population+'</td><td data-label="Top X%"><strong>Top '+p.top+'%</strong></td></tr>').join('')+'</tbody></table></details></section>');}
function ranking(){const content=statusBlock()||(state==='unconfigured'?'<section class="empty" data-empty><h2>Ranking da edição ainda não configurado</h2><p>A regra de participação precisa ser definida pela equipe. Nenhuma classificação está disponível.</p></section>':state==='insufficient'?'<section class="empty" data-empty><h2>A edição ainda não oferece simulados suficientes</h2><p>O ranking ficará disponível quando houver resultados liberados suficientes para a política configurada.</p></section>':'<section class="section"><div class="section-title"><div><h2>Ranking de ENAMED 2027.2</h2><p class="meta">Política de demonstração: 3 melhores simulados, mínimo de 2 participações.</p></div><span class="badge">137 participantes elegíveis</span></div><div class="notice">Média bruta apenas dentro desta edição. Cada linha informa quantos simulados foram realmente considerados; não há equivalência de escala entre edições.</div><table class="data-table"><caption>Classificação da edição</caption><thead><tr><th>Posição</th><th>Participante</th><th>Média bruta</th><th>Considerados</th><th>Concluídos</th></tr></thead><tbody>'+[{p:1,name:'Candidato #1',avg:'84,33%',used:3,total:4},{p:2,name:'Candidato #2',avg:'82,50%',used:2,total:2},{p:3,name:'Você',avg:'81,67%',used:3,total:3}].map(x=>'<tr data-candidate class="'+(x.name==='Você'?'own':'')+'"><td data-label="Posição">'+x.p+'</td><td data-label="Participante"><strong>'+x.name+'</strong></td><td data-label="Média bruta">'+x.avg+'</td><td data-label="Considerados">'+x.used+' de até 3</td><td data-label="Concluídos">'+x.total+'</td></tr>').join('')+'</tbody></table><p class="meta">Desempate: média, maior nota considerada, conclusão mais antiga e identificador. Valores calculados pelo servidor.</p><div class="pagination"><span>Página 1 • 50 por página • amostra visual de 3 linhas</span><div class="actions"><button disabled>Anterior</button><button>Próxima</button></div></div></section>');return '<h1>Ranking</h1><p class="intro">Consulte a classificação do simulado ou a regra de participação da edição escolhida.</p><div class="tabs" role="tablist" aria-label="Escopo do ranking"><button role="tab" aria-selected="false">Simulado</button><button role="tab" aria-selected="true">Edição</button></div><div class="toolbar"><div class="field"><label for="ranking-edition">Edição</label><select id="ranking-edition"><option>ENAMED 2027.2 (demonstração)</option><option>ENAMED 2027.1 (demonstração)</option></select></div></div>'+content;}
function cutoffDialog(){return '<dialog aria-labelledby="cutoff-title"><div class="dialog-head"><div><h2 id="cutoff-title">Referências de corte</h2><p class="meta">Instituição de demonstração / Clínica Médica</p></div><button data-close aria-label="Fechar referências">Fechar</button></div><div class="tabs" role="tablist" aria-label="Referência"><button role="tab" aria-selected="false">Referência selecionada</button><button role="tab" aria-selected="true">Histórico da referência</button></div><div class="notice">Estas referências não são comparáveis. Processos e escalas distintos permanecem separados; não indicam tendência nem previsão de aprovação.</div><section class="section" data-cutoff-source><h3>Processo de demonstração A</h3><p class="meta">Referência 2026.1 • Ano 2026, primeiro período</p><p>Fonte: catálogo de demonstração A</p><p><strong>Ampla concorrência: 720</strong><br>Cotas: indisponível<br>Vagas: 12</p><p class="meta">Versão da fonte indisponível. Escala não certificada.</p></section><section class="section" data-cutoff-source><h3>Processo de demonstração B</h3><p class="meta">Referência 2027.1 • Ano 2027, primeiro período</p><p>Fonte: catálogo de demonstração B</p><p><strong>Ampla concorrência: 76</strong><br>Cotas: 70<br>Vagas: 10</p><p class="meta">Versão da fonte indisponível. Escala não certificada.</p></section><section class="section"><h3>Origem não confirmada</h3><p class="meta">1 registro legado sem referência confirmada, separado deste histórico. Nenhum processo ou ano foi atribuído.</p></section></dialog>';}
function cutoffs(){return '<h1>Referências de corte</h1><p class="intro">Consulte a origem de cada referência antes de interpretá-la em relação aos seus resultados.</p>'+(statusBlock()||'<section class="section"><h2>Clínica Médica</h2><p>Instituição de demonstração</p><p class="meta">O histórico preserva separadamente processo, fonte, ano e período. Não há conversão para nota do simulado.</p><button class="primary" id="open-cutoff">Ver histórico da referência</button></section>'+cutoffDialog());}
function reuseDialog(){return '<dialog aria-labelledby="reuse-title"><div class="dialog-head"><h2 id="reuse-title">Reusar versão 2 em rascunho</h2><button data-close aria-label="Fechar reuso">Fechar</button></div><p>A cópia recebe novos identificadores de questão e alternativas. A identidade do banco e a versão escolhida permanecem vinculadas.</p><form id="reuse-form"><div class="form-grid"><div class="field"><label for="draft">Simulado de destino</label><select id="draft" required><option value="">Selecione um rascunho</option value="draft-demo">Simulado 3 • ENAMED 2027.2 • Rascunho</option></select></div><div class="field"><label for="question-number">Número da questão</label><input id="question-number" type="number" min="1" max="100" value="8" required></div></div>'+ (state==='locked'?'<div class="notice" role="alert">Outro editor está alterando este conteúdo. Atualize os rascunhos e tente novamente. Nenhuma retentativa automática foi feita.</div><button type="button" id="reload-drafts">Atualizar rascunhos</button>':'')+'<p class="meta">O servidor valida formato, área, blueprint, posição livre e permissão. A ação não publica o simulado.</p><p id="reuse-result" role="status"></p><div class="footer"><button type="button" data-close>Cancelar</button><button type="submit" class="primary">Adicionar ao rascunho</button></div></form></dialog>';}
function bank(){return '<h1>Banco de questões</h1><p class="intro">Consulte a identidade, as versões observadas e o uso de cada questão, sem alterar o histórico.</p>'+(statusBlock()||'<div class="toolbar"><div class="field" style="flex:1;max-width:520px"><label for="bank-search">Buscar pelo conteúdo da questão</label><input id="bank-search" placeholder="Buscar pelo enunciado"></div><span class="meta">1 identidade nesta demonstração</span></div><div class="split"><section class="section"><h2>Questões</h2><table class="data-table"><caption>Identidades preservadas</caption><thead><tr><th>Questão</th><th>Versão</th><th>Usos ativos</th></tr></thead><tbody><tr><td data-label="Questão"><span>Paciente com dor torácica: investigação inicial e conduta.<span class="cell-meta">Clínica Médica / Cardiologia</span><button id="select-bank">Ver versões</button></span></td><td data-label="Versão">2<span class="cell-meta">'+(state==='incomplete'?'Incompleta':'Completa')+'</span></td><td data-label="Usos ativos">3</td></tr></tbody></table></section><section class="section"><h2>Versões desta identidade</h2><div class="version-row"><div><strong>Versão 2</strong><span class="cell-meta">Observada em 04/11/2026 (demo)</span></div><span class="badge">'+(state==='incomplete'?'Incompleta':'Completa')+'</span></div><div class="version-row"><div><strong>Versão 1</strong><span class="cell-meta">Observada em 03/11/2026 (demo)</span></div><span class="badge">Foto do legado</span></div><p class="meta">A observação não representa a data de autoria da questão.</p><h3 style="margin-top:24px">Comparar versão 2 com versão 1</h3><div class="diff"><div><strong>Versão 1</strong><p>Qual a investigação indicada para dor torácica?</p><p class="meta">A. ECG<br>B. Tomografia<br>Gabarito: A</p></div><div><strong>Versão 2</strong><p>Qual a investigação inicial indicada diante deste quadro de dor torácica?</p><p class="meta">A. ECG<br>B. Tomografia<br>Gabarito: A</p></div></div><button class="primary" id="reuse-version" '+(state==='incomplete'?'disabled':'')+'>Reusar versão 2 em rascunho</button>'+(state==='incomplete'?'<p class="meta">Versões incompletas não podem ser reutilizadas.</p>':'')+'</section></div><section class="section"><div class="section-title"><div><h2>Análise por item</h2><p class="meta">Somente agregados da identidade selecionada. Não comprova a versão exibida durante a prova.</p></div><span class="badge">Análise agregada</span></div>'+(state==='restricted'?'<p>Análise indisponível para sua permissão. A consulta de versões e o reuso continuam disponíveis.</p>':'<table class="data-table"><caption>Resultados observados por versão, edição e modalidade de participação</caption><thead><tr><th>Versão e origem</th><th>Edição</th><th>Participação</th><th>Respostas</th><th>Acerto observado</th></tr></thead><tbody><tr><td data-label="Versão e origem"><span>2<span class="cell-meta">Observada no resultado</span></span></td><td data-label="Edição">2027.2</td><td data-label="Participação">Na janela</td><td data-label="Respostas">128</td><td data-label="Acerto observado">62,5%</td></tr><tr><td data-label="Versão e origem"><span>Sem atribuição<span class="cell-meta">Legado não atribuível</span></span></td><td data-label="Edição">2027.1</td><td data-label="Participação">Treino ou fora da janela</td><td data-label="Respostas">32</td><td data-label="Acerto observado">50%</td></tr></tbody></table><p class="meta">Proporção bruta de acertos, incluindo itens em branco. Não é TRI nem calibração psicométrica.</p>')+'</section>'+reuseDialog());}
function openDialog(trigger){const dialog=root.querySelector('dialog');if(!dialog)return;dialogTrigger=trigger;dialog.showModal();dialog.querySelector('button,select,input')?.focus();}
function render(){const reopen=root.querySelector('dialog')?.open;scenePicker.value=scene;statePicker.value=state;root.innerHTML=({history:percentileHistory,ranking,cutoffs,bank}[scene])();document.getElementById('breadcrumb').textContent=scene==='bank'?'Administração / Conteúdo / Banco de questões':'Meu desempenho / '+({history:'Comparativo',ranking:'Ranking',cutoffs:'Referências de corte'}[scene]);document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-current',b.dataset.scene===scene?'page':'false'));root.querySelector('#retry')?.addEventListener('click',()=>{state='ready';render();});root.querySelector('#open-cutoff')?.addEventListener('click',e=>openDialog(e.currentTarget));root.querySelector('#reuse-version')?.addEventListener('click',e=>openDialog(e.currentTarget));root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>root.querySelector('dialog')?.close()));root.querySelector('dialog')?.addEventListener('close',()=>dialogTrigger?.focus());root.querySelector('#reuse-form')?.addEventListener('submit',e=>{e.preventDefault();root.querySelector('#reuse-result').textContent='Demonstração: cópia adicionada ao rascunho. Novos IDs gerados pelo servidor.';});root.querySelector('#reload-drafts')?.addEventListener('click',()=>{state='ready';render();openDialog(root.querySelector('#reuse-version'));});if(reopen)openDialog(root.querySelector(scene==='bank'?'#reuse-version':'#open-cutoff'));}
scenePicker.addEventListener('change',()=>{scene=scenePicker.value;state='ready';render();});statePicker.addEventListener('change',()=>{state=statePicker.value;render();});document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>{scene=b.dataset.scene;state='ready';render();}));document.getElementById('theme-toggle').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));document.addEventListener('keydown',e=>{if(e.key==='Escape')root.querySelector('dialog[open]')?.close();});render();
</script>
